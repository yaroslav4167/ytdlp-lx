      <stop offset="0" stop-color="#07152e"/>
      <stop offset="0.55" stop-color="#0b2d5c"/>
      <stop offset="1" stop-color="#087cb5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#31b8ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#31b8ff" stop-opacity="0"/>
